[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "math-grading-agent"
version = "0.1.0"
description = "Auditable math homework and exam grading MVP"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "starlette>=0.40,<2",
  "packaging>=24,<27",
  "uvicorn>=0.34,<1",
  "python-multipart>=0.0.20,<1",
  "pydantic>=2.10,<3",
  "sympy>=1.13,<2",
  "Pillow>=11,<13",
  "pypdfium2>=4.30,<6",
  "python-docx>=1.2,<2",
  "olefile>=0.47,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<10",
  "ruff>=0.17,<0.18",
]
local_recognition = [
  "opencv-contrib-python>=4.10,<5",
  "numpy>=1.26,<2.4",
]
# OCR frontend only: install the CPU/CUDA Paddle runtime separately.
ocr_engine = [
  "paddleocr>=3.7,<3.8",
  "opencv-contrib-python==4.10.0.84",
  "numpy>=1.26,<2.4",
]
# CPU only. GPU setup uses ocr_engine plus the official CUDA wheel.
ocr = [
  "paddleocr>=3.7,<3.8",
  "paddlepaddle>=3.3,<3.4",
  "opencv-contrib-python==4.10.0.84",
  "numpy>=1.26,<2.4",
]

[project.scripts]
grading-agent = "grading_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
grading_agent = ["static/*", "services/documents/*.ps1"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# These launchers configure local imports/model caches before loading libraries.
"scripts/check-gpu.py" = ["E402"]
"scripts/verify-local-layout.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
cache_dir = "tests/artifacts/cache/pytest"
norecursedirs = ["artifacts", ".venv", ".venv-gpu", ".venv-ocr"]

